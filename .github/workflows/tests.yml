name: Security, OCR, WebSocket and retrieval tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install -r requirements-test.txt
      - name: Run tests with employer-supplied PDFs
        run: python -m pytest -q
